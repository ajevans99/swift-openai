name: Package - Swift

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: SDK and generation / Swift 6.1
    runs-on: macos-15
    timeout-minutes: 45
    env:
      OPENAI_LIVE_SNAPSHOT: "0"
      OPENAI_RECORD_SNAPSHOTS: "0"

    steps:
    - uses: actions/checkout@v7

    - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
      with:
        swift-version: "6.1.3"

    - name: Verify supported toolchain
      run: swift --version | tee /dev/stderr | grep -E 'Swift version 6\.1(\.| )'

    - name: Run linting
      run: make lint SWIFT_FORMAT="swift format"

    - name: Verify generation tooling and pinned inputs
      run: |
        python3 -B -m unittest discover -s Scripts/tests
        make responses-inputs

    - name: Build
      run: swift build --jobs 2

    - name: Run offline tests
      run: swift test --jobs 2

    - name: Read immutable generator revision
      id: generator
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        from pathlib import Path
        record = json.loads(Path("Generation/OpenAIResponses/generation.json").read_text())["generator"]
        assert not record["uncommittedSources"]
        assert not record["dependencyOverrides"]
        assert record["sdkRuntimeOverride"] is None
        print("revision=" + record["revision"])
        PY

    - uses: actions/checkout@v7
      with:
        repository: ajevans99/swift-openapi-schema-codegen
        ref: ${{ steps.generator.outputs.revision }}
        path: .build/generation-tools/swift-openapi-schema-codegen

    - name: Verify clean generation drift
      run: |
        generator="$GITHUB_WORKSPACE/.build/generation-tools/swift-openapi-schema-codegen"
        swift package --package-path "$generator" --scratch-path .build/responses-generator resolve
        make responses-check RESPONSES_GENERATOR_PACKAGE="$generator" RESPONSES_GENERATOR_FLAGS="--jobs 2"
